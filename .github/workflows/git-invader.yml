# Para VARDHAMANPATEL23/git-invader
# Colocar en el repo de perfil NicolasPonceH/NicolasPonceH:
# .github/workflows/git-invader.yml
#
# Después de agregarlo: habilitar Actions en ese repo si no está
# habilitado, y correrlo una vez manualmente (Actions → Git Invader →
# Run workflow) para que se cree la rama `output` con los SVG que
# github/README.md ya referencia.

name: Git Invader

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Space Invaders SVG
        uses: VARDHAMANPATEL23/git-invader@v1.0.0
        with:
          github_username: NicolasPonceH
          github_token: ${{ secrets.GITHUB_TOKEN }}
          color: green
          mode: dark
