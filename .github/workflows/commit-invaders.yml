# Para Goblinlordx/commit-invaders (reemplaza a VARDHAMANPATEL23/git-invader,
# que resultó ser un wrapper de snake sin la parte "invaders" implementada).
# Colocar en el repo de perfil NicolasPonceH/NicolasPonceH:
# .github/workflows/commit-invaders.yml

name: Generate Commit Invaders

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Goblinlordx/commit-invaders@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: NicolasPonceH
